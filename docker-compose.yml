services:
  db:
    image: postgres:16
    container_name: vaadin-sovellus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaadin_sovellus
      POSTGRES_USER: vaadin
      POSTGRES_PASSWORD: vaadin
    ports:
      - "5432:5432"
    volumes:
      - vaadin-db-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: vaadin-sovellus-app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vaadin_sovellus
      SPRING_DATASOURCE_USERNAME: vaadin
      SPRING_DATASOURCE_PASSWORD: vaadin
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: true
      SPRING_SQL_INIT_MODE: always
      VAADIN_LAUNCH_BROWSER: false

volumes:
  vaadin-db-data: